<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VehicleAuctions MVP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
        }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .emoji { font-size: 2.5rem; margin-right: 10px; }
        .status { margin: 20px 0; padding: 15px; background: rgba(34, 197, 94, 0.1); border-left: 4px solid #22c55e; border-radius: 4px; text-align: left; }
        .status-item { margin: 8px 0; display: flex; align-items: center; gap: 10px; }
        .buttons { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        button { padding: 12px 24px; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; flex: 1; min-width: 120px; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }
        .btn-purple { background: #8b5cf6; color: white; }
        .btn-purple:hover { background: #7c3aed; transform: translateY(-2px); }
        .footer { margin-top: 20px; font-size: 0.9rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="emoji">🚗</span>VehicleAuctions MVP</h1>
        <div class="status">
            <div class="status-item"><span>✅</span><span>Déploiement en ligne!</span></div>
            <div class="status-item"><span>✅</span><span>Interface responsive</span></div>
            <div class="status-item"><span>✅</span><span>Auth + Listings + Bidding</span></div>
        </div>
        <div class="buttons">
            <button class="btn-primary" onclick="window.location.href='signup.html'">S'inscrire</button>
            <button class="btn-success" onclick="window.location.href='login.html'">Se connecter</button>
            <button class="btn-purple" onclick="window.location.href='browse.html'">Parcourir</button>
        </div>
        <div class="footer">
            <p>Phase 1 MVP - Janvier 2026</p>
            <p><a href="https://github.com/olivierlelevrier-spec/vehicle-auctions" target="_blank" style="color: #60a5fa;">GitHub →</a></p>
        </div>
    </div>
</body>
</html>
