<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VehicleAuctions MVP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            text-align: center;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            padding: 40px;
        }
        h1 { font-size: 2rem; margin: 0 0 20px 0; }
        .emoji { font-size: 2.5rem; margin-right: 10px; }
        .status { background: rgba(34, 197, 94, 0.1); padding: 15px; margin: 20px 0; border-left: 4px solid #22c55e; }
        .status-item { margin: 8px 0; }
        button { padding: 12px 24px; margin: 10px 5px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-purple { background: #8b5cf6; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="emoji">🚗</span>VehicleAuctions MVP</h1>
        <div class="status">
            <div class="status-item">✅ Déploiement en ligne!</div>
            <div class="status-item">✅ Interface responsive</div>
            <div class="status-item">✅ Prêt pour les features</div>
        </div>
        <div>
            <button class="btn-primary" onclick="alert('Feature: Signup - à venir')">S'inscrire</button>
            <button class="btn-success" onclick="alert('Feature: Login - à venir')">Se connecter</button>
            <button class="btn-purple" onclick="alert('Feature: Browse - à venir')">Parcourir</button>
        </div>
        <p style="margin-top: 30px; color: #94a3b8; font-size: 0.9rem;">MVP Phase 1 - Janvier 2026</p>
    </div>
</body>
</html>
